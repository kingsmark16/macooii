[project]
name = "macooii-desktop"
version = "0.8.0"
description = "A private-by-default bilingual Windows personal assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "pydantic>=2.10,<3",
  "playwright>=1.50,<2",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "sounddevice>=0.5,<1",
  "numpy>=2,<3",
  "faster-whisper>=1.1,<2",
  "av>=14,<17",
  "pywin32>=308; sys_platform == 'win32'",
  "kokoro-onnx>=0.6.1,<0.7",
]

[project.scripts]
macooii = "macooii.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6.11,<7", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macooii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
